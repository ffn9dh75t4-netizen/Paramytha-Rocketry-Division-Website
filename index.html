
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .background-photo {
            display: block;
            width: auto;
            height: auto;
            max-width: 80vw;
            max-height: 80vh;
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .background-photo {
                max-width: 90vw;
                max-height: 85vh;
            }
        }
    </style>
</head>

<body>
    <img
        src="photo.jpg.png"
        alt="Website photo"
        class="background-photo"
    >
</body>
</html>
